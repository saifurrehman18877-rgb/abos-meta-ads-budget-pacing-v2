<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ads Budget Pacing v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #2E7D32;
            --primary-hover: #1B5E20;
            --accent: #FFC107;
            --background: #F5F5F5;
            --surface: #FFFFFF;
            --text-primary: #212121;
            --text-muted: #757575;
            --border: #E0E0E0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
        }
        .heading-font {
            font-family: 'Roboto', sans-serif;
        }
        .body-font {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-gray-900">Meta Ads Budget Pacing v2</span>
                </div>
                <div class="flex items-center space-x-8">
                    <a href="index.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Home</a>
                    <a href="pricing.html" class="text-gray-900 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Pricing</a>
                    <a href="app.html" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md text-sm font-medium">Open App</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <h1 class="text-2xl font-bold mb-4">Upload CSV</h1>
            <div class="mb-4">
                <label for="csv-upload" class="block text-sm font-medium text-gray-700 mb-2">Upload your Meta Ads CSV file</label>
                <input type="file" id="csv-upload" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[var(--primary)] file:text-white hover:file:bg-[var(--primary-hover)]">
            </div>
            <div class="mb-4">
                <label for="target-budget" class="block text-sm font-medium text-gray-700 mb-2">Target Budget</label>
                <input type="number" id="target-budget" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[var(--primary)] focus:border-[var(--primary)]">
            </div>
            <div class="mb-4">
                <label for="start-date" class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
                <input type="date" id="start-date" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[var(--primary)] focus:border-[var(--primary)]">
            </div>
            <div class="mb-4">
                <label for="end-date" class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
                <input type="date" id="end-date" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[var(--primary)] focus:border-[var(--primary)]">
            </div>
            <button id="calculate-pacing" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md text-sm font-medium">Calculate Pacing</button>
        </div>

        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">Daily Pacing</h2>
            <div id="daily-pacing-results" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">Budget Thresholds</h2>
            <div class="mb-4">
                <label for="threshold-percentage" class="block text-sm font-medium text-gray-700 mb-2">Threshold Percentage</label>
                <input type="number" id="threshold-percentage" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[var(--primary)] focus:border-[var(--primary)]">
            </div>
            <button id="calculate-threshold" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md text-sm font-medium">Calculate Threshold</button>
            <div id="threshold-results" class="mt-4">
                <!-- Results will be displayed here -->
            </div>
        </div>

        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-xl font-bold mb-4">Ad Performance Metrics</h2>
            <button id="calculate-performance" class="bg-[var(--primary)] hover:bg-[var(--primary-hover)] text-white px-4 py-2 rounded-md text-sm font-medium">Calculate Performance</button>
            <div id="performance-results" class="mt-4">
                <!-- Results will be displayed here -->
            </div>
        </div>
    </div>

    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
